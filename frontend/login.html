<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EcoTrack</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


    <div class="auth-page">


        <!-- Left Side -->

        <div class="auth-info">

            <a href="index.html" class="brand">

                🌱 EcoTrack

            </a>


            <div class="auth-info-content">

                <h1>
                    Welcome back.
                </h1>


                <p>
                    Continue tracking your activities and see how your
                    everyday choices affect the environment.
                </p>


                <div class="info-points">

                    <p>✓ Track your carbon footprint</p>

                    <p>✓ View your personal progress</p>

                    <p>✓ Get reduction suggestions</p>

                </div>

            </div>

        </div>



        <!-- Right Side -->

        <div class="auth-form-section">


            <div class="auth-form">


                <h2>
                    Log in to EcoTrack
                </h2>


                <p class="form-subtitle">
                    Enter your details to continue.
                </p>


                <!-- Google Login -->

                <button
                    type="button"
                    class="google-btn"
                    id="googleLoginBtn">

                    <span>G</span>

                    Continue with Google

                </button>


                <div class="divider">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- Login Form -->

                <form id="loginForm">


                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>


                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>


                    <button
                        type="submit"
                        class="submit-btn">

                        Log In

                    </button>


                </form>


                <p class="switch-page">

                    Don't have an account?

                    <a href="signup.html">

                        Sign up

                    </a>

                </p>


                <p
                    id="message"
                    class="message">

                </p>


            </div>


        </div>


    </div>


    <script type="module" src="js/auth.js"></script>


</body>

</html>
