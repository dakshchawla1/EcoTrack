<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EcoTrack</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-page">
        <div class="auth-header">
            <a href="index.html" class="auth-brand">
                <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                </svg>
                EcoTrack
            </a>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <h2>Create an account</h2>
                <p class="auth-subtitle">Join EcoTrack to track activities and lower your personal emissions.</p>

                <!-- Google Sign Up -->
                <button type="button" class="google-btn" id="googleSignupBtn">
                    <svg class="google-icon-svg" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>

                <!-- Signup Form -->
                <form id="signupForm" class="auth-form">
                    <div class="auth-field">
                        <label for="signupName">Your Name</label>
                        <input type="text" id="signupName" placeholder="e.g. Alex Morgan" required autocomplete="name">
                    </div>

                    <div class="auth-field">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
                    </div>

                    <div class="auth-field">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
                    </div>

                    <div class="auth-field">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Repeat your password" minlength="6" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="auth-submit-btn">Create Account</button>
                </form>

                <p id="message" class="auth-message"></p>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in here</a>
                </div>
            </div>

            <div style="text-align: center;">
                <a href="index.html" class="auth-back-link">← Back to home page</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>

</body>

</html>
